name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"

            - name: Reject local path dependencies in the lockfile
              run: |
                  # A `file:` entry means someone committed a lockfile produced
                  # by testing against a local tarball or `npm link`. It installs
                  # fine on their machine and breaks everywhere else — the exact
                  # failure that left phantom entries across these repos before.
                  if grep -nE '"(resolved|version)": "file:' package-lock.json; then
                    echo "package-lock.json pins a local path dependency — release-blocking."
                    exit 1
                  fi

            - run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build
